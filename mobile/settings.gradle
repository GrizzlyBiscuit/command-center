pluginManagement {
  repositories {
    google { mavenCentral() }
    mavenCentral()
    gradlePluginPortal()
  }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google { mavenCentral() }
    mavenCentral()
  }
}
rootProject.name = "CommandCenterMobile"
include(":app")
